<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="コマンドセットをワンクリックでコピー">
  <title>Command Copy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⌘ Command Copy</h1>
    <p>コマンドをクリックでコピー・セット全体を一括コピー</p>
  </header>

  <main>
    <input type="search" id="search" placeholder="検索...(例: usbmuxd, IPA)" autocomplete="off" autofocus>
    <div id="list"></div>
    <p id="empty" class="empty hidden">見つかりませんでした</p>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="main.js"></script>
</body>
</html>
